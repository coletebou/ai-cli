name: CI

on:
  pull_request:
  push:
    branches: [master]

# CI only reads the repository.
permissions:
  contents: read

# A new push to a branch or PR supersedes its in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: [self-hosted, personal-linux]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Windows differs in Ctrl+C handling, rustyline's console backend,
        # `@C:\path` references and the %APPDATA% config dir. There is no
        # personal Windows host, so that leg stays GitHub-hosted.
        include:
          - os: linux
            runner: [self-hosted, personal-linux]
          - os: macos
            runner: [self-hosted, personal-macos]
          - os: windows-latest
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV
    runs-on: [self-hosted, personal-linux]
    steps:
      - uses: actions/checkout@v5
      # Read the version from Cargo.toml so the job can't drift from the
      # declared rust-version.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
