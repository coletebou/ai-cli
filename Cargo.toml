[package]
name = "ai-cli"
version = "0.1.0"
edition = "2021"
description = "Multi-provider AI CLI - query Grok, ChatGPT, Gemini, Claude simultaneously"
authors = ["Cole Tebou"]

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
# AI Provider Client
genai = "0.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Error Handling
anyhow = "1"

# Config & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Terminal Output
colored = "2"
termimad = "0.30"

# Markdown Parsing (for TUI rendering)
pulldown-cmark = "0.11"

# Interactive chat mode — readline-style input editing with history
rustyline = "14"

# Async Streaming
tokio-stream = "0.1"

# HTTP-date parsing for the `Retry-After` header (RFC 7231 allows
# integer-seconds OR an HTTP-date; httpdate handles the date form).
httpdate = "1"

# Observability — OpenTelemetry traces shipped to a self-hosted Langfuse
# via OTLP/HTTP. No-op when LANGFUSE_PUBLIC_KEY/SECRET_KEY are unset.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client", "reqwest-rustls"] }
base64 = "0.22"
